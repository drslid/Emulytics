services:
  orchestrator-api:
    environment:
      EMULYTIX_LEGACY_CONTROL_ENABLED: "false"

  worker:
    profiles: ["worker"]
    build:
      context: ./orchestrator-api
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      EMULYTIX_DATABASE_URL: ${EMULYTIX_DATABASE_URL:-}
      EMULYTIX_HOST_ID: ${EMULYTIX_HOST_ID:-bench-host}
      EMULYTIX_LEASE_TTL: ${EMULYTIX_LEASE_TTL:-30}
      EMULYTIX_LOCK_ROOT: /host-locks
      EMULYTIX_ARTIFACT_ROOT: /storage/runs
      EMULYTIX_APK_ROOT: /apks
      ADB_SERVER_SOCKET: ${ADB_SERVER_SOCKET:-tcp:emulytix-wf01-android:5037}
    volumes:
      - worker_locks:/host-locks
      - ./storage/runs:/storage/runs
      - ./storage/runtime-apks:/apks:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - emulytix
      - android_bench

networks:
  android_bench:
    external: true
    name: ${EMULYTIX_BENCH_NETWORK:-emulytix-wf01-bench}

volumes:
  worker_locks:
