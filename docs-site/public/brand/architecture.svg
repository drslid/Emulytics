<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc">
<title id="title">Emulytics architecture</title><desc id="desc">A browser reaches the web console and the Python and Go APIs. PostgreSQL stores journeys, schedules, the queue and leases. A scheduler submits work, and an Android worker executes it against a device and stores step evidence.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#8a9bad"/></marker><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif} .title{font-size:18px;font-weight:700;fill:#172b43}.detail{font-size:13px;fill:#4a6278}.link{fill:none;stroke:#8a9bad;stroke-width:2;marker-end:url(#arrow)}</style></defs>
<rect width="1120" height="440" rx="16" fill="#f7f9fc"/>
<text x="40" y="42" font-size="12" font-weight="800" letter-spacing="1" fill="#596f83">ONE SELF-HOSTED CONTROL PLANE</text>
<g transform="translate(40 85)"><rect width="195" height="108" rx="12" fill="#fff" stroke="#c9d9ed"/><rect width="195" height="5" rx="2" fill="#1967d2"/><text x="22" y="44" class="title">Web console</text><text x="22" y="68" class="detail">React · Next.js · TOTP</text><text x="22" y="88" class="detail">Devices, journeys, results</text></g>
<g transform="translate(300 85)"><rect width="230" height="108" rx="12" fill="#fff" stroke="#d8cdec"/><rect width="230" height="5" rx="2" fill="#7c4dba"/><text x="22" y="44" class="title">Control APIs</text><text x="22" y="68" class="detail">Python mutations · Go reads</text><text x="22" y="88" class="detail">Sessions, roles and validation</text></g>
<g transform="translate(595 85)"><rect width="225" height="108" rx="12" fill="#fff" stroke="#b9dcd5"/><rect width="225" height="5" rx="2" fill="#168574"/><text x="22" y="44" class="title">PostgreSQL</text><text x="22" y="68" class="detail">Journeys, queue and leases</text><text x="22" y="88" class="detail">Schedules and audit events</text></g>
<g transform="translate(885 85)"><rect width="195" height="108" rx="12" fill="#fff" stroke="#d5dce5"/><rect width="195" height="5" rx="2" fill="#60758c"/><text x="20" y="44" class="title">Scheduler</text><text x="20" y="68" class="detail">Timezone-aware CRON</text><text x="20" y="88" class="detail">Persistent due requests</text></g>
<g transform="translate(595 280)"><rect width="225" height="108" rx="12" fill="#fff" stroke="#c4dfcc"/><rect width="225" height="5" rx="2" fill="#188558"/><text x="22" y="44" class="title">Android worker</text><text x="22" y="68" class="detail">Guarded device commands</text><text x="22" y="88" class="detail">Assertions and step evidence</text></g>
<g transform="translate(300 280)"><rect width="230" height="108" rx="12" fill="#fff" stroke="#ecd5bd"/><rect width="230" height="5" rx="2" fill="#c86a24"/><text x="22" y="44" class="title">Android devices</text><text x="22" y="68" class="detail">Persistent emulators</text><text x="22" y="88" class="detail">Connected physical phones</text></g>
<g transform="translate(885 280)"><rect width="195" height="108" rx="12" fill="#fff" stroke="#d8cdec"/><rect width="195" height="5" rx="2" fill="#7c4dba"/><text x="20" y="44" class="title">Private artifacts</text><text x="20" y="68" class="detail">Screenshots and UI XML</text><text x="20" y="88" class="detail">Authenticated viewing</text></g>
<path class="link" d="M235 139H285"/><path class="link" d="M530 139H580"/><path class="link" d="M885 139H835"/><path class="link" d="M707 193V264"/><path class="link" d="M595 334H545"/><path class="link" d="M820 334H870"/>
<text x="38" y="286" font-size="17" font-weight="750" fill="#172b43">Prepare → publish → run</text><text x="38" y="313" font-size="14" fill="#4a6278">Review the device result.</text><text x="38" y="337" font-size="14" fill="#4a6278">Keep the evidence.</text>
<text x="40" y="419" font-size="12" fill="#667b8c">Conceptual architecture · Internal services and Android control ports remain private in the default deployment.</text>
