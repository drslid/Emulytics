services:
  validation-ui:
    build:
      context: ./web-ui
      dockerfile: Dockerfile.preview
    restart: unless-stopped
    environment:
      EMULYTIX_VALIDATION_DIR: /validation-evidence
      EMULYTIX_API_INTERNAL_URL: http://console-api:8010
      EMULYTIX_GO_API_INTERNAL_URL: ${EMULYTIX_GO_API_INTERNAL_URL-http://console-go-api:8020}
      EMULYTIX_PUBLIC_ORIGIN: ${EMULYTIX_PUBLIC_ORIGIN:-http://localhost:3100}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - ./storage/wf01-worker:/validation-evidence:ro
    depends_on:
      console-api:
        condition: service_healthy
      console-go-api:
        condition: service_healthy

  console-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: emulytix
      POSTGRES_USER: emulytix_console
      POSTGRES_PASSWORD: ${EMULYTIX_POSTGRES_PASSWORD:?Run scripts/start-console.sh first}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emulytix_console -d emulytix"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - console_postgres:/var/lib/postgresql/data

  console-api:
    build:
      context: ./orchestrator-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: &console_api_env
      EMULYTIX_DATABASE_URL: ${EMULYTIX_DATABASE_URL:?Run scripts/start-console.sh first}
      EMULYTIX_CONTROL_TOKEN: ${EMULYTIX_CONTROL_TOKEN:?Run scripts/start-console.sh first}
      EMULYTIX_AUTH_ENABLED: "true"
      EMULYTIX_AUTH_KEY: ${EMULYTIX_AUTH_KEY:?Run scripts/start-console.sh first}
      EMULYTIX_PUBLIC_ORIGIN: ${EMULYTIX_PUBLIC_ORIGIN:-http://localhost:3100}
      EMULYTIX_COOKIE_SECURE: ${EMULYTIX_COOKIE_SECURE:-true}
      EMULYTIX_UI_INTERNAL_URL: http://validation-ui:3000/connexion
      EMULYTIX_VERSION: ${EMULYTIX_VERSION:-}
      EMULYTIX_TELEMETRY_ENABLED: "true"
      EMULYTIX_STORAGE_ROOT: /storage
      EMULYTIX_ARTIFACT_ROOT: /storage/runs
      EMULYTIX_APK_ROOT: /apks
      EMULYTIX_CHATGPT_ENABLED: "true"
      EMULYTIX_OLLAMA_URL: ${EMULYTIX_OLLAMA_URL:-}
      EMULYTIX_OLLAMA_MODEL: ${EMULYTIX_OLLAMA_MODEL:-}
      EMULYTIX_DEEPSEEK_API_KEY: ${EMULYTIX_DEEPSEEK_API_KEY:-}
      EMULYTIX_DEEPSEEK_MODEL: ${EMULYTIX_DEEPSEEK_MODEL:-deepseek-flash}
    volumes:
      - ./storage/runs:/storage/runs:ro
      - ./storage/runtime-apks:/apks
      - ./workflows:/workflows:ro
      - ./storage/updates/requests:/updates/requests
      - ./storage/updates/status:/updates/status:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      console-postgres:
        condition: service_healthy

  console-go-api:
    build:
      context: ./console-api-go
    restart: unless-stopped
    environment:
      EMULYTIX_DATABASE_URL: ${EMULYTIX_DATABASE_URL:?Run scripts/start-console.sh first}
      EMULYTIX_AUTH_INTERNAL_URL: http://console-api:8010
      EMULYTIX_PUBLIC_ORIGIN: ${EMULYTIX_PUBLIC_ORIGIN:-http://localhost:3100}
      EMULYTIX_TELEMETRY_ENABLED: "true"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "/console-api-go", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      console-api:
        condition: service_healthy
      console-postgres:
        condition: service_healthy

  console-scheduler:
    build:
      context: ./orchestrator-api
    restart: unless-stopped
    command: ["python", "-m", "app.scheduler"]
    environment:
      EMULYTIX_DATABASE_URL: ${EMULYTIX_DATABASE_URL:?Run scripts/start-console.sh first}
      EMULYTIX_TELEMETRY_ENABLED: "true"
    depends_on:
      console-postgres:
        condition: service_healthy

  console-migrate:
    profiles: ["tools"]
    build:
      context: ./orchestrator-api
    command: ["python", "-m", "app.migrate"]
    environment:
      <<: *console_api_env
      EMULYTIX_DEEPSEEK_API_KEY: ""
    depends_on:
      console-postgres:
        condition: service_healthy

volumes:
  console_postgres:
