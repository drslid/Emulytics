name: Build Android runtime

on:
  workflow_dispatch:
    inputs:
      accept_android_license:
        description: 'I accept the Android SDK terms at https://developer.android.com/studio/terms'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  runtime:
    if: ${{ inputs.accept_android_license }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build pinned Android image from official archives
        run: docker build --platform linux/amd64 --build-arg ANDROID_SDK_LICENSE_ACCEPTED=true -f android-runtime/Dockerfile.console -t emulytix/android-runtime:0.9.0 android-runtime
      - name: Verify SDK and system-image revisions
        run: |
          docker run --rm --entrypoint /bin/bash emulytix/android-runtime:0.9.0 -lc '
            set -e
            adb version
            emulator -version
            grep -Fx "Pkg.Revision=13" /opt/android-sdk/system-images/android-29/google_apis/x86_64/source.properties
          '
