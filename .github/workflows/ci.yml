name: Verify console

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  queue: max

jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: orchestrator-api/requirements.lock
      - name: Install verified dependencies
        run: |
          python -m pip install --upgrade pip==26.3
          python -m pip install --require-hashes -r orchestrator-api/requirements.lock
          python -m pip install pytest==9.2.0
      - name: Prepare disposable database image
        run: docker pull postgres:17-alpine
      - name: Test API, worker and installer
        run: python -m pytest orchestrator-api/tests

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: npm install --global npm@10.9.4 --ignore-scripts --no-fund
      - run: npm ci --ignore-scripts --no-fund
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm audit --audit-level=high

  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: console-api-go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: console-api-go/go.mod
          cache-dependency-path: console-api-go/go.sum
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go build ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  deployment-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate shell scripts and Compose
        env:
          EMULYTIX_POSTGRES_PASSWORD: compose-validation-only
          EMULYTIX_DATABASE_URL: postgresql://validation:validation@console-postgres/validation
          EMULYTIX_CONTROL_TOKEN: compose-validation-only
          EMULYTIX_AUTH_KEY: compose-validation-only
        run: |
          find scripts android-runtime/scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
          docker compose -f docker-compose.preview.yml -f docker-compose.console-worker.yml --profile worker config --quiet

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Audit the hashed Python runtime lock
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit --require-hashes -r orchestrator-api/requirements.lock
      - name: Audit the isolated Codex runtime lock
        working-directory: orchestrator-api/codex-runtime
        run: npm audit --audit-level=high
      - name: Scan complete Git history for secrets
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --redact=100 --no-banner --log-opts=--all

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'drslid/Emulytics'
    needs: [api, frontend, go, deployment-contract, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish the verified version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          component='(0|[1-9][0-9]{0,5})'
          version_pattern="$component[.]$component[.]$component"
          if [[ ! "$version" =~ ^$version_pattern$ || "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo 'Expected a stable MAJOR.MINOR.PATCH version at the verified commit.' >&2
            exit 1
          fi
          tag="v$version"

          stable_tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          if grep -Fxq "$tag" <<< "$stable_tags"; then
            echo "Release $tag is already published."
            exit 0
          fi
          latest_tag=$(awk -v pattern="^v$version_pattern$" '$0 ~ pattern' <<< "$stable_tags" | sort -V | tail -n 1)
          if [[ -n "$latest_tag" && "$(printf '%s\n' "$latest_tag" "$tag" | sort -V | tail -n 1)" != "$tag" ]]; then
            echo "Release $tag must be newer than $latest_tag." >&2
            exit 1
          fi

          tag_ref="refs/tags/$tag"
          remote_tag_commit() {
            git ls-remote --tags origin "$tag_ref" "$tag_ref^{}" | awk -v ref="$tag_ref" '
              $2 == ref { tag = $1 }
              $2 == ref "^{}" { peeled = $1 }
              END { print peeled ? peeled : tag }
            '
          }
          tag_commit=$(remote_tag_commit)
          if [[ -n "$tag_commit" && "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "Tag $tag already identifies a different commit." >&2
            exit 1
          fi

          release_notes=$(mktemp)
          trap 'rm -f -- "$release_notes"' EXIT
          notes_args=(--generate-notes)
          if [[ -f CHANGELOG.md ]]; then
            awk -v heading="## $version" '
              { sub(/\r$/, "") }
              $0 == heading { found = 1; next }
              found && /^##[[:space:]]/ { exit }
              found { print }
            ' CHANGELOG.md > "$release_notes"
            if grep -q '[^[:space:]]' "$release_notes"; then
              notes_args=(--notes-file "$release_notes")
            fi
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Emulytics $tag" "${notes_args[@]}" --latest
          published_commit=$(remote_tag_commit)
          if [[ "$published_commit" != "$GITHUB_SHA" ]]; then
            echo "Published tag $tag does not identify the verified commit." >&2
            exit 1
          fi
